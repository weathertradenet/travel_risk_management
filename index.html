<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Environmental risk dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="page">
    <div class="header">
      <h1 class="title">Environmental risk dashboard</h1>
      <p class="subtitle">powered by Everloop</p>
    </div>
    <div class="map-shell">
      <div id="map"></div>
      <div class="map-brand"><div class="brand-main">Risk intelligence</div></div>
      <div class="legend">
        <div class="legend-grid" id="legend-grid"></div>
        <div class="legend-scale-title">Average percentage infrastructure exposed to environmental hazards</div>
        <div class="legend-scale" id="scale"></div>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
